<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Архів Ароматів</title>
  <script>
    // Standard GitHub Pages SPA redirect trick (project-page variant:
    // pathSegmentsToKeep = 1, for the "/site-aromaarchive/" repo prefix).
    // Someone opening a direct link like /product/creed-aventus-abc123/
    // hits this 404 page (GitHub Pages has no such physical file); this
    // packs that path into a query string and sends them to index.html,
    // which unpacks it and hands the real path back to the app's router.
    var pathSegmentsToKeep = 1;
    var l = window.location;
    l.replace(
      l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?p=/" +
      l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
      (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
