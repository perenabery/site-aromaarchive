  // GitHub Pages SPA redirect decode (project-page variant of the
  // well-known rafgraham/spa-github-pages 404 trick). If 404.html sent us
  // here with the real path packed into ?p=..., restore it before the app
  // reads window.location so deep links like /product/<slug>/ resolve.
  (function (l) {
    if (l.search[1] === "p") {
      var decoded = l.search.slice(1).split("&").filter(function (s) { return s.slice(0, 2) === "p="; })[0];
      window.history.replaceState(null, null,
        l.pathname.slice(0, -1) + (decoded ? decoded.slice(2).replace(/~and~/g, "&") : "") + l.hash
      );
    }
  })(window.location);
